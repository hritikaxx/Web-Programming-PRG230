<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - PAWS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


<div class="contact-container">

    <h1>Contact Us</h1>
    <p>Have questions or want to adopt a pet? Get in touch with us!</p>
<div class="contact-info">
        <p><b>Location:</b> Kathmandu, Nepal</p>
        <p><b>Phone:</b> 9800000000</p>
        <p><b>Email:</b> pawspetadoption@gmail.com</p>
    </div>
    <h2>Send Us a Message</h2>

    <form class="contact-form">
        <label>Name:</label><br>
        <input type="text" placeholder="Enter your name"><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Enter your email"><br>

        <label>Message:</label><br>
        <textarea rows="4" placeholder="Write your message"></textarea><br>

        <button type="submit">Send Message</button>
    </form>
        <a href="index.html" class="back-btn">Back to Home</a>

</div>

</body>
</html>

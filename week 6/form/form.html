<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paws - Dog Adoption Application</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Paws</a>
  </div>
</nav>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-7">

      <div class="card shadow">
        <div class="card-body">

          <h3 class="text-center mb-3">Dog Adoption Application</h3>
          <p class="text-center text-muted">
            After reviewing your application, our team will contact you to schedule a visit. 
            Once approved, you may come to our shelter to complete the adoption and pick up your dog.
          </p>

          <form>

            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" placeholder="Enter your full name" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Phone Number</label>
              <input type="tel" class="form-control" placeholder="Enter your phone number" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Home Address</label>
              <input type="text" class="form-control" placeholder="Enter your full address" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Type of Housing</label>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="housing" id="apartment" required>
                <label class="form-check-label" for="apartment">Apartment</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="housing" id="house">
                <label class="form-check-label" for="house">House</label>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Preferred Date for Shelter Visit</label>
              <input type="date" class="form-control">
            </div>

            <div class="mb-3">
              <label class="form-label">Why would you like to adopt this dog?</label>
              <textarea class="form-control" rows="3" placeholder="Tell us about your interest in adopting..."></textarea>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="agreement" required>
              <label class="form-check-label" for="agreement">
                I understand that adoption is subject to approval and I will visit the shelter to complete the process.
              </label>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">Submit Application</button>
              <button type="reset" class="btn btn-secondary">Reset</button>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>

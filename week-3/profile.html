<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile Description</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #ffcccc;
        }

        .profile-card {
            width: 350px;
            background-color: #fc8b8b;
            padding: 20px;
            margin: 50px auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .profile-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }

        .profile-card h2 { 
            margin: 15px 0 5px;
            color: #3a3a3a;
        }

        .profile-card h4 {
            color: #535353;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <img src="https://media.istockphoto.com/id/2171382633/vector/user-profile-icon-anonymous-person-symbol-blank-avatar-graphic-vector-illustration.jpg?s=612x612&w=0&k=20&c=ZwOF6NfOR0zhYC44xOX06ryIPAUhDvAajrPsaZ6v1-w=" alt="Profile Picture">
        <h2>Hritika Singh</h2>
        <h4>BScIT Student</h4>
        <p>
            I am an aspiring UI/UX and Graphic Designer, 
            passionate about creating designs that are not 
            only visually appealing and creative but also intuitive and user-centered. 
        </p>
    </div>

</body>
</html>
